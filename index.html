<title>Soliqlar bo‘yicha testlar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f4fa;--warn:#d99a00;--card:#fff;--text:#1c2430;--muted:#5c6878;--line:#d9e0ea;--head:#dfe7f4;--pri:#1f4fa3;--ok:#2e9b4f;--okbg:#e7f6ec;--bad:#d64545;--badbg:#fdeceb;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--warn:#f0b429;--card:#18202e;--text:#e8edf5;--muted:#9aa7ba;--line:#2a3547;--head:#162033;--pri:#4f86e8;--ok:#4cc272;--okbg:#14301f;--bad:#ef6b6b;--badbg:#3a1a1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1420;--warn:#f0b429;--card:#18202e;--text:#e8edf5;--muted:#9aa7ba;--line:#2a3547;--head:#162033;--pri:#4f86e8;--ok:#4cc272;--okbg:#14301f;--bad:#ef6b6b;--badbg:#3a1a1c;color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--head)}
header h1{flex:1;font-size:18px;font-weight:600;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.ib{background:none;border:0;font-size:22px;padding:4px 8px;line-height:1}
.bar{display:flex;justify-content:space-between;padding:12px 16px;background:var(--head)}
.chip{background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--muted)}
.chip b{color:var(--pri)}
.star{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;margin-right:8px}
main{flex:1;overflow-y:auto;padding:18px 16px}
.timer{display:block;width:max-content;margin:0 auto 18px;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:14px;color:var(--muted);background:var(--card)}
.q{font-size:18px;font-weight:600;line-height:1.4;margin:0 0 16px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:12px;padding:15px 14px;margin-bottom:12px;font-size:15px;line-height:1.35}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:13px;color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .dot{background:var(--ok);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .dot{background:var(--bad);border-color:var(--bad)}
footer{padding:12px 16px 16px}
.pri{width:100%;background:var(--pri);color:#fff;border:0;border-radius:24px;padding:15px;font-size:16px;font-weight:600}
.pri:disabled{opacity:.45}
.sec{width:100%;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px;font-size:15px;margin-top:10px}
.center{text-align:center;padding-top:30px}
.big{font-size:56px;font-weight:700;color:var(--pri);margin:10px 0}
.muted{color:var(--muted)}
.rv{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px;text-align:left}
.rv i{display:block;color:var(--ok);font-style:normal;margin-top:6px}
.hide{display:none}
.ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--head);display:grid;place-items:center;font-size:24px}
.chip .bad{color:var(--bad)}.best.y{color:var(--warn)}.best.r{color:var(--bad)}#back{flex:none;width:42px;height:42px;padding:0;border-radius:50%;background:var(--pri);border:0;color:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.28);transition:transform .12s,box-shadow .12s}#back svg{width:22px;height:22px;display:block}#back:active{transform:scale(.9);box-shadow:0 1px 4px rgba(0,0,0,.3)}.best{margin-left:auto;flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--ok);background:conic-gradient(currentColor calc(var(--p)*1%),var(--line) 0)}.best b{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:14px;font-weight:700;letter-spacing:-.3px}.sub{display:block;color:var(--muted);font-size:13px;margin-top:3px}.num{border-color:var(--pri);color:var(--pri);font-weight:600}
</style></head><body>

<script>
const BANK=[{"q": "O’zbekiston Respublikasi yangi tahrirdagi Konstitutsiyasida soliq tizimiga tegishli bo'lgan moddalarni ko’rsating.", "o": ["63, 149", "10, 51, 78", "4, 14, 111", "51, 123"], "c": 0}, {"q": "“Soliqlar” tushunchasiga toʻliq berilgan ta’rifni aniqlang.", "o": ["Soliqlar deganda, Soliq kodeksida belgilangan, Oʻzbekiston Respublikasining Davlat byudjetiga yoki davlat maqsadli jamgʻarmasiga toʻlanadigan majburiy begʻaraz toʻlov tushuniladi", "Soliqlar deganda, faqat rezidentlardan undiriladigan majburiy pul toʻlovlari tushuniladi", "Soliqlar deganda, muntazam, qaytarib berilmaydigan majburiy pul toʻlovlari tushuniladi", "Soliqlar deganda, muayyan miqdorlarda undiriladigan, budjetga yoʻnaltiriladigan ixtiyoriy va begʻaraz pul toʻlovlari tushuniladi"], "c": 0}, {"q": "Yangi soliq turlarini joriy etish yoki avvalgisini bekor qilish huquqi qaysi vakolatli organga berilgan?", "o": ["Oʻzbekiston Respublikasi Oliy Majlisi", "Oʻzbekiston Respublikasi Soliq qoʻmitasi", "Oʻzbekiston Respublikasi Adliya vazirligi", "Oʻzbekiston Respublikasi Iqtisodiyot va moliya vazirligi"], "c": 0}, {"q": "O’zbekiston Respublikasi Soliq kodeksida soliqqa tortishning qanday printsiplari keltirilgan?", "o": ["Soliq solishning majburiyligi, aniqligi va soliq organlarining soliq toʼlovchilar bilan hamkorligi, adolatliligi, soliq tizimining yagonaligi, oshkoralik va soliq to’lovchining haqligi prezumptsiyasi printsiplari", "Majburiylik, qonun oldida tenglik, pul mablag’larining erkin harakatini cheklamasligi, hamma daromadlarni soliqqa tortish, ijtimoiy adolat tamoyili va soliq to’lovchining haqligi prezumptsiyasi printsiplari", "Oddiylik va xolislik, soliq to’lovchining haqligi prezumptsiyasi printsiplari", "Tadbirkorlik va investitsiyalarni rag’batlantirish, jami daromadlarni soliqqa tortish, soliq to’lovchining haqligi prezumptsiyasi printsiplari"], "c": 0}, {"q": "Soliq solishning majburiyligi printsipi keltirilgan qatorni toping.", "o": ["har bir shaxs belgilangan soliqlar va boshqa majburiy to’lovlarni to’lashi shart", "har bir shaxs belgilangan soliqlar va boshqa majburiy to’lovlarni to’lashi ixtiyoriy", "har bir shaxs belgilangan soliqlar va boshqa majburiy to’lovlarni to’lashi shart emas", "har bir shaxs belgilangan soliqlar va boshqa majburiy to’lovlarni shartnoma asosida to’lashi mumkin"], "c": 0}, {"q": "Soliq solishning adolatliligi printsipi keltirilgan qatorni toping.", "o": ["soliq solish umumiydir", "soliq solish ijtimoiy, irqiy, milliy, diniy va boshqa shu kabi mezonlardan kelib chiqqan holda belgilanadi", "soliq solish majburiydir", "soliq solish mulkning shakliga, jismoniy shaxslarning fuqaroligiga qarab belgilanadi"], "c": 0}, {"q": "Soliq tizimining yagonaligi printsipi keltirilgan qatorni toping", "o": ["soliq tizimi O’zbekiston Respublikasining butun hududida yagonadir", "soliq solish mulkning shakliga, jismoniy shaxslarning fuqaroligiga qarab belgilanadi", "soliqlar va boshqa majburiy to’lovlarning barcha elementlari, shu jumladan ularni toʼlash muddatlari va tartibi aniq bo’lishi kerak", "soliq solish masalalarini tartibga soluvchi normativ-huquqiy hujjatlar rasmiy nashrlarda e’lon qilinishi shart"], "c": 0}, {"q": "Soliq to’g’risidagi qonun hujjatlarining oshkoraligi printsipi keltirilgan qatorni toping", "o": ["Soliq toʼgʼrisidagi qonunchilik hujjatlari rasman eʼlon qilinishi shart", "Soliq tizimi O’zbekiston Respublikasining butun hududida barcha soliq to’lovchilarga nisbatan yagonadir", "Soliqlar va boshqa majburiy to’lovlarning barcha elementlari, shu jumladan ularni toʼlash muddatlari va tartibi aniq bo’lishi kerak", "Soliq solish mulkning shakliga, jismoniy shaxslarning fuqaroligiga qarab belgilanadi"], "c": 0}, {"q": "Oʻzbekiston Respublikasi Prezidentining qarori bilan ayrim soliq turlari boʻyicha soliq stavkasini kamaytirish qancha muddatga berilishi mumkin?", "o": ["koʻpi bilan uch yil muddatga", "dastlabki besh yilga", "koʻpi bilan ikki yil muddatga", "koʻpi bilan oʻn yil muddatga"], "c": 0}, {"q": "Yangi tahrirdagi (483 moddali) Soliq kodeksi qachondan amalga kiritilgan?", "o": ["2020-yil 1-yanvardan", "2019-yil 1-apreldan", "2019-yil 1-yanvardan", "2021-yil 1-yanvardan"], "c": 0}, {"q": "Amaldagi Soliq Kodeksi necha moddadan iborat?", "o": ["483 moddadan", "480 moddadan", "392 moddadan", "135 moddadan"], "c": 0}, {"q": "O’zbekiston Respublikasi Soliq kodeksi quyidagilarning qaysi birining huquqlarini, majburiyatlarini, vazifalarini belgilaydi?", "o": ["Soliq to’lovchilarning", "Chet ellik yuridik va jismoniy shaxslarning", "Soliq organlarining", "Faqat yuridik shaxslarning"], "c": 0}, {"q": "O’zbekiston Respublikasi Soliq kodeksining Maxsus qismida qaysi masalalar yoritilgan?", "o": ["Soliqlar va boshqa majburiy to’lovlar hamda ularning elementlari", "Soliqlar bo'yicha tekshirish turlari", "Soliqqa tortish tamoyillari", "Soliq nazoratining shakllari"], "c": 0}, {"q": "O’zbekiston Respublikasi Soliq kodeksining nechanchi moddasida soliqlar va yig`imlarning turlari keltirilgan?", "o": ["17-modda", "23-modda", "31-modda", "6-modda"], "c": 0}, {"q": "Soliq elementlari to’liq aks etgan qatorni ko'rsating.", "o": ["Soliq solish ob’ekti, soliq bazasi, soliq stavkasi, soliq davri, soliqni hisoblab chiqarish tartibi, soliq hisobotini taqdim etish tartibi, soliqni to’lash tartibi.", "Soliq solinadigan baza, stavka, hisoblab chiqarish tartibi, soliq davri, soliq hisobotini taqdim etish tartibi, to’lash tartibi.", "Soliq stavka, hisoblab chiqarish tartibi, soliq davri, soliq hisobotini taqdim etish tartibi.", "Soliq stavkasi, soliq davri, soliq hisobotini taqdim etish va to'lash tartibi."], "c": 0}, {"q": "Soliq to’lovchi deganda kimlarni tushunamiz?", "o": ["Soliq kodeksiga muvofiq zimmasiga belgilangan soliqlar hamda yig’imlarni to’lash majburiyati yuklatilgan yuridik va jismoniy shaxslar", "Soliq kodeksiga muvofiq zimmasiga soliqlar, davlat bojlari hamda yig’imlarni to’lash majburiyati yuklatilgan faqat rezident yuridik va jismoniy shaxslar", "Soliq kodeksiga muvofiq zimmasig uvchi yuridik shaxslar", "Jami daromadi bir milliard soʻmdan oshgan yuridik shaxslar"], "c": 0}, {"q": "Aylanmadan olinadigan soliq tatbiq etilmaydigan soliq toʻlovchilar toʻgʻri keltirilgan javobni tanlang?", "o": ["Aksiz soligʻi toʻlanadigan tovarlarni (xizmatlarni) ishlab chiqaruvchi va foydali qazilmalarni kavlab olishni amalga oshiruvchi yuridik shaxslarga", "Tovarlarni (xizmatlarni) realizatsiya qilishdan olingan daromadi yuz million soʻmdan oshgan, lekin bir milliard soʻmgacha boʻlgan yakka tartibdagi tadbirkorlar", "Soliq davrida tovarlarni (xizmatlarni) realizatsiya qilishdan olingan jami daromadi bir milliard soʻmdan oshmagan yuridik shaxslar", "Yakka tartibdagi tadbirkorlar"], "c": 0}, {"q": "Qishloq xoʻjaligi tovar ishlab chiqaruvchilariga 25 gektar va undan ortiq sugʻoriladigan ekin maydoni mavjud boʻlsa qaysi soliq turi tatbiq etilmaydi?", "o": ["Aylanmadan olinadigan soliq", "Daromad soligʻi", "Qoʻshilgan qiymat soligʻi", "Ijtimoiy soliq"], "c": 0}, {"q": "Aholisi soni yuz ming nafar va undan koʻp kishidan iborat shaharlarda chakana savdo sohasidagi soliq toʻlovchilar uchun aylanmadan olinadigan soliq stavkasi necha foiz qilib belgilangan?", "o": ["4", "15", "6", "10"], "c": 0}, {"q": "2024-yil 1-yanvardan jami daromadi besh yuz million soʼmdan oshmagan soliq toʼlovchilar uchun aylanmadan olinadigan soliqning qat'iy stavkasi qancha qilib belgilandi?", "o": ["25,0 mln so'm", "34,0 mln so'm", "4 foiz", "1 foiz"], "c": 0}, {"q": "2024-yil 1-yanvardan jami daromadi besh yuz million soʼmdan yuqori bo'lgan soliq toʼlovchilar uchun aylanmadan olinadigan soliqning qat'iy stavkasi qancha qilib belgilandi?", "o": ["34,0 mln so'm", "25,0 mln so'm", "4 foiz", "1 foiz"], "c": 0}, {"q": "Borish qiyin boʻlgan va togʻli tumanlarda joylashgan chakana savdo korxonalari uchun aylanmadan olinadigan soliq stavkasi necha foiz qilib belgilangan?", "o": ["1", "10", "15", "4"], "c": 0}, {"q": "Soliq kodeksiga asosan mol-mulk soligʻi toʻlovchilari boʻlgan yuridik shaxslar toif function show(){done=false;const q=qs[i];$("#sc").textContent=score;$("#wr").textContent=wrong.length;$("#no").textContent=(i+1)+"/"+qs.length;
