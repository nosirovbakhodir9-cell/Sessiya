<title>Soliqlar bo‘yicha testlar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f4fa;--warn:#d99a00;--card:#fff;--text:#1c2430;--muted:#5c6878;--line:#d9e0ea;--head:#dfe7f4;--pri:#1f4fa3;--ok:#2e9b4f;--okbg:#e7f6ec;--bad:#d64545;--badbg:#fdeceb;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--warn:#f0b429;--card:#18202e;--text:#e8edf5;--muted:#9aa7ba;--line:#2a3547;--head:#162033;--pri:#4f86e8;--ok:#4cc272;--okbg:#14301f;--bad:#ef6b6b;--badbg:#3a1a1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1420;--warn:#f0b429;--card:#18202e;--text:#e8edf5;--muted:#9aa7ba;--line:#2a3547;--head:#162033;--pri:#4f86e8;--ok:#4cc272;--okbg:#14301f;--bad:#ef6b6b;--badbg:#3a1a1c;color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--head)}
header h1{flex:1;font-size:18px;font-weight:600;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.ib{background:none;border:0;font-size:22px;padding:4px 8px;line-height:1}
.bar{display:flex;justify-content:space-between;padding:12px 16px;background:var(--head)}
.chip{background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--muted)}
.chip b{color:var(--pri)}
.star{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;margin-right:8px}
main{flex:1;overflow-y:auto;padding:18px 16px}
.timer{display:block;width:max-content;margin:0 auto 18px;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:14px;color:var(--muted);background:var(--card)}
.q{font-size:18px;font-weight:600;line-height:1.4;margin:0 0 16px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:12px;padding:15px 14px;margin-bottom:12px;font-size:15px;line-height:1.35}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:13px;color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .dot{background:var(--ok);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .dot{background:var(--bad);border-color:var(--bad)}
footer{padding:12px 16px 16px}
.pri{width:100%;background:var(--pri);color:#fff;border:0;border-radius:24px;padding:15px;font-size:16px;font-weight:600}
.pri:disabled{opacity:.45}
.sec{width:100%;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px;font-size:15px;margin-top:10px}
.center{text-align:center;padding-top:30px}
.big{font-size:56px;font-weight:700;color:var(--pri);margin:10px 0}
.muted{color:var(--muted)}
.rv{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px;text-align:left}
.rv i{display:block;color:var(--ok);font-style:normal;margin-top:6px}

const BANK=[{"q": "O’zbekiston Respublikasi yangi tahrirdagi Konstitutsiyasida soliq tizimiga tegishli bo'lgan moddalarni ko’rsating.", "o": ["63, 149", "10, 51, 78", "4, 14, 111", "51, 123"], "c": 0}, {"q": "“Soliqlar” tushunchasiga toʻliq berilgan ta’rifni aniqlang.", "o": ["Soliqlar deganda, Soliq kodeksida belgilangan, Oʻzbekiston Respublikasining Davlat byudjetiga yoki davlat maqsadli jamgʻarmasiga toʻlanadigan majburiy begʻaraz toʻlov tushuniladi", "Soliqlar deganda, faqat rezidentlardan undiriladigan majburiy pul toʻlovlari tushuniladi", "Soliqlar deganda, muntazam, qaytarib berilmaydigan majburiy pul toʻlovlari tushuniladi", "Soliqlar deganda, muayyan miqdorlarda undiriladigan, budjetga yoʻnaltiriladigan ixtiyoriy va begʻaraz pul toʻlovlari tushuniladi"], "c": 0}, {"q": "Yangi soliq turlarini joriy etish yoki avvalgisini bekor qilish huquqi qaysi vakolatli organga berilgan?", "o": ["Oʻzbekiston Respublikasi Oliy Majlisi", "Oʻzbekiston Respublikasi Soliq qoʻmitasi", "Oʻzbekiston Respublikasi Adliya vazirligi", "Oʻzbekiston Respublikasi Iqtisodiyot va moliya vazirligi"], "c": 0}, {"q": "O’zbekiston Respublikasi Soliq kodeksida soliqqa tortishning qanday printsiplari keltirilgan?", "o": ["Soliq solishning majburiyligi, aniqligi va soliq organlarining soliq toʼlovchilar bilan hamkorligi, adolatliligi, soliq tizimining yagonaligi, oshkoralik va soliq to’lovchining haqligi prezumptsiyasi printsiplari", "Majburiylik, qonun oldida tenglik, pul mablag’larining erkin harakatini cheklamasligi, hamma daromadlarni soliqqa tortish, ijtimoiy adolat tamoyili va soliq to’lovchining haqligi prezumptsiyasi printsiplari", "Oddiylik va xolislik, soliq to’lovchining haqligi prezumptsiyasi printsiplari", "Tadbirkorlik va investitsiyalarni rag’batlantirish, jami daromadlarni soliqqa tortish, soliq to’lovchining haqligi prezumptsiyasi printsiplari"], "c": 0}, {"q": "Soliq solishning majburiyligi printsipi keltirilgan qatorni toping.", "o": ["har bir shaxs belgilangan soliqlar va bos hiqqan boʻlib, “ikkilamchi tovar” ma’nosini bildiradi", "nemis tilidan kelib chiqqan boʻlib, “yarimta” ma’nosini bildiradi", "fransuz tilidan kelib chiqqan boʻlib, “ikkilamchi tovar” ma’nosini bildiradi"], "c": 0}, {"q": "Aktsiz solig’ining to’lovchilari bo’lib kimlar hisoblanadi?", "o": ["O’zbekiston Respublikasi hududida aktsiz solig’iga tortiladigan tovarlar ishlab chiqaruvchilar va import qiluvchi yuridik va jismoniy shaxslar, tabiiy gazni isteʼmolchilarga realizatsiya qilishni amalga oshiruvchilar", "O’zbekiston Respublikasi hududida aktsiz solig’iga tortiladigan tovarlar ishlab chiqaruvchi jismoniy shaxslar, telekommunikatsiya mobil aloqa xizmatlarini (aktsiz toʼlanadigan xizmatlarni) koʼrsatadigan Oʼzbekiston Respublikasi yuridik shaxslari", "O’zbekiston Respublikasi hududida aktsiz solig’iga tortiladigan tovarlar ishlab chiqaruvchi yuridik shaxslar", "O’zbekiston Respublikasi hududidan aktsiz solig’iga tortiladigan tovarlarni eksport qiluvchi yuridik shaxslar"], "c": 0}, {"q": "Keltirilgan bandlardan qaysi biri aktsiz soligʻining soliqqa tortish obyekti hisoblanadi?", "o": ["aktsiz toʻlanadigan tovarlardan oʻz ehtiyojlari uchun foydalanish", "Oʻzbekiston Respublikasi Vazirlar Mahkamasi tomonidan belgilanadigan tartibda insonparvarlik yordami sifatida olib kirish", "ixtisoslashtirilgan gaz ta’minoti korxonalari orqali aholiga suyultirilgan gazni maishiy ehtiyojlar uchun realizatsiya qilish", "aktsiz toʻlanadigan tovarlarni eksportga (eksportning bojxona tartib-taomillarida) realizatsiya qilish, bundan aksiz toʻlanadigan tovarlarning ayrim turlari mustasno"], "c": 0}, {"q": "Quyidagilarning qaysi biri aktsiz solig’ining soliqqa tortish ob'ekti bo'lib hisoblanmaydi?", "o": ["Aktsiz to’lanadigan tovarlarning eksportiga", "Aktsiz to’lanadigan tovarlarning importiga", "Berilgan xom ashyodan tayyorlangan mahsulotga", "Zargarlik buyumlariga"], "c": 0}, {"q": "Aktsiz soligʻining qanday stavkalari mavjud?", "o": ["Foiz (advalor), mutlaq (qat’iy) va aralash", "Mutlaq (qat’iy) va regressiv", "Foiz (advalor), regressiv va progressiv", "Aralash va progressiv"], "c": 0}, {"q": "Aktsiz soligʻi stavkalari qaysi me’yoriy hujjat bilan belgilanadi?", "o": ["Oʻzbekiston Respublikasining Davlat byudjeti toʻgʻrisidagi Qonuni bilan", "Oʻzbekiston Respublikasi Prezidenti qarori bilan", "Oʻzbekiston Respublikasi Vazirlar Mahkamasi qarori bilan", "Oʻzbekiston Respublikasi Iqtisodiyot va moliya vazirligi buyrug'i bilan"], "c": 0}, {"q": "Aktsiz solig’i stavkalari qanday belgilanadi?", "o": ["Tovarning qiymatiga nisbatan foizlarda va naturada ifodalangan o’lchov birligiga mutlaq summada qat’iy belgilanadi", "Tovarning qiymatiga nisbatan qat’iy so’mlarda", "Tovarning qiymatiga nisbatan foizlarda", "Tovarlarning o’lchov birligiga nisbatan foizlarda"], "c": 0}, {"q": "Aktsizosti tovarlarni ishlab chiqaruvchi yuridik shaxslarga qaysi soliq turi tatbiq etilmaydi?", "o": ["Aylanmadan olinadigan soliq", "Foyda soligʻi", "Ijtimoiy soliq", "Qo‘shilgan qiymat solig‘i"], "c": 0}, {"q": "2024-yilda tabiiy gaz belgilangan aksiz soligʻi stavkasi toʻgʻri koʻrsatilgan qatorni belgilang.", "o": ["20", "25", "10", "19"], "c": 0}, {"q": "Aktsiz soligʻi solish maqsadida mobil aloqa xizmatlari uchun stavka 2024-yilda necha foiz qilib belgilangan?", "o": ["10", "20", "11", "25"], "c": 0}, {"q": "Jami daromadi bir milliard so’mdan oshmagan tadbirkorlar qo‘shilgan qiymat solig‘i va foyda solig’ini to’lash o’rniga qaysi soliqni to’lovchisi bo’ladi?", "o": ["Aylanmadan olinadigan soliq", "Aktsiz solig’i", "Yer qa’ridan foydalanganlik uchun soliq", "Deklaratsiya asosida soliqqa tortish"], "c": 0}, {"q": "Aylanmadan olinadigan soliqni toʻlovchilar koʻrsatilgan toʻgri javobni belgilang?", "o": ["Soliq davrida tovarlarni (xizmatlarni) realizatsiya qilishdan olingan jami daromadi bir milliard soʻmdan oshmagan yuridik shaxslar", "Aksiz soligʻi toʻlanadigan tovarlarni (xizmatlarni) ishlab chiqaruvchi yuridik shaxslar", "Lotoreyalarni tashkil etish boʻyicha faoliyatni amalga oshiruvchi yuridik shaxslar", "Jami daromadi bir milliard soʻmdan oshgan yuridik shaxslar"], "c": 0}, {"q": "Aylanmadan olinadigan soliq tatbiq etilmaydigan soliq toʻlovchilar toʻgʻri keltirilgan javobni tanlang?", "o": ["Aksiz soligʻi toʻlanadigan tovarlarni (xizmatlarni) ishlab chiqaruvchi va foydali qazilmalarni kavlab olishni amalga oshiruvchi yuridik shaxslarga", "Tovarlarni (xizmatlarni) realizatsiya qilishdan olingan daromadi yuz million soʻmdan oshgan, lekin bir milliard soʻmgacha boʻlgan yakka tartibdagi tadbirkorlar", "Soliq davrida tovarlarni (xizmatlarni) realizatsiya qilishdan olingan jami daromadi bir milliard soʻmdan oshmagan yuridik shaxslar", "Yakka tartibdagi tadbirkorlar"], "c": 0}, {"q": "Qishloq xoʻjaligi tovar ishlab chiqaruvchilariga 25 gektar va undan ortiq sugʻoriladigan ekin maydoni mavjud boʻlsa qaysi soliq turi tatbiq etilmaydi?", "o": ["Aylanmadan olinadigan soliq", "Daromad soligʻi", "Qoʻshilgan qiymat soligʻi", "Ijtimoiy soliq"], "c": 0}, {"q": "Aholisi soni yuz ming nafar va undan koʻp kishidan iborat shaharlarda chakana savdo sohasidagi soliq toʻlovchilar uchun aylanmadan olinadigan soliq stavkasi necha foiz qilib belgilangan?", "o": ["4", "15", "6", "10"], "c": 0}, {"q": "2024-yil 1-yanvardan jami daromadi besh yuz million soʼmdan oshmagan soliq toʼlovchilar uchun aylanmadan olinadigan soliqning qat'iy stavkasi qancha qilib belgilandi?", "o": ["25,0 mln so'm", "34,0 mln so'm", "4 foiz", "1 foiz"], "c": 0}, {"q": "2024-yil 1-yanvardan jami daromadi besh yuz million soʼmdan yuqori bo'lgan soliq toʼlovchilar uchun aylanmadan olinadigan soliqning qat'iy stavkasi qancha qilib belgilandi?", "o": ["34,0 mln so'm", "25,0 mln so'm", "4 foiz", "1 foiz"], "c": 0}, {"q": "Borish qiyin boʻlgan va togʻli tumanlarda joylashgan chakana savdo korxonalari uchun aylanmadan olinadigan soliq stavkasi necha foiz qilib belgilangan?", "o": ["1", "10", "15", "4"], "c": 0}, {"q": "Soliq kodeksiga asosan mol-mulk soligʻi toʻlovchilari boʻlgan yuridik shaxslar toifasini aniqlang?", "o": ["Oʻzbekiston Respublikasida soliq solish obyekti hisoblangan mol-mulkka ega boʻlgan yuridik shaxslar hamda Oʻzbekiston Respublikasi hududida koʻchmas mulkka ega boʻlgan norezident yuridik shaxslar.", "Oʻzbekiston Respublikasi hududidan tashqarida mol - mulkka ega boʻlgan yuridik shaxslar.", "Oʻzbekiston Respublikasi hududida avtotransport vositalariga ega boʻlgan Oʻzbekiston Respublikasi norezident yuridik shaxslari.", "Oʻzbekiston Respublikasi hududida asbob-uskunalarga ega boʻlgan yuridik shaxslar."], "c": 0}, {"q": "Soliq kodeksiga binoan quyidagilardan qaysilari yuridik shaxslarning mol-mulk soligʻi ob'yekti tarkibiga kiradi?", "o": ["Temir yoʻllar, magistral quvurlar, aloqa va elektr uzatish liniyalari, shuningdek ushbu obyektlarning ajralmas texnologik qismi boʻlgan inshootlar.", "Tabiatni muhofaza qilish va sanitariya - tozalash maqsadlari, yongʻin xavfsizligi uchun foydalaniladigan obyektlar.", "Soliq toʻlovchining balansida boʻlgan hamda tadbirkorlik faoliyatida foydalanilmayotgan, fuqaro muhofazasi va safarbarlik ahamiyatiga molik obyektlar.", "Umumiy foydalanishdagi avtomobil yoʻllari."], "c": 0}, {"q": "Yuridik shaxslarning mol-mulkiga solinadigan soliq bazasi qanday aniqlanadi?", "o": ["Oʻrtacha yillik qoldiq qiymatiga nisbatan aniqlanadi.", "Oʻrtacha yillik qiymatiga nisbatan aniqlanadi.", "Oʻrtacha oylik qoldiq qiymatiga nisbatan aniqlanadi.", "Oʻrtacha choraklik qoldiq qiymatiga nisbatan."], "c": 0}, {"q": "Normativ (belgilangan) muddatda tugallanmagan qurilish obyektlari uchun yuridik shaxslarning mol-mulkiga solinadigan soliq bazasi qanday aniqlanadi?", "o": ["Oʻrtacha yillik qiymatiga nisbatan aniqlanadi.", "Oʻrtacha yillik qoldiq qiymatiga nisbatan aniqlanadi.", "Oʻrtacha oylik qoldiq qiymatiga nisbatan aniqlanadi.", "Chorak qoldiq qiymatiga nisbatan."], "c": 0}, {"q": "2024-yilda yuridik shaxslarning mol-mulkiga solinadigan soliq stavkasi necha foiz qilib belgilangan?", "o": ["1,5", "2", "4", "3"], "c": 0}, {"q": "Soliq k polizchilik shirkatlarining umumiy foydalanishdagi yerlari.", "Rekreatsiya ahamiyatiga molik yerlar."], "c": 0}, {"q": "Qayta tiklanadigan manbalaridan energiya ishlab chiqaruvchilar qayta tiklanadigan energiya manbalari (nominal quvvati 0.1 MVt va koʻproq) uskunalari bilan band yer uchastkalari boʻyicha ular foydalanishga kiritilgan vaqtdan necha muddatga soliqdan ozod etiladi?", "o": ["Oʻn yil muddatga.", "Oʻn besh yil muddatga.", "Besh yil muddatga.", "Uch yil muddatga."], "c": 0}, {"q": "Toshkent shahrida joylashgan yuridik shaxslar uchun yer soligʻini hisoblashda nechta hudud mavjud?", "o": ["1,2,3,4,5-hududlar.", "0,1,2,3,4-hududlar.", "1,4,5-hududlar.", "1,2,3-hududlar va baholanmagan yerlar uchun berilgan zona."], "c": 0}, {"q": "Resurs soliqlariga qaysi soliq turlari kiradi?", "o": ["yer solig’i, suv resurslardan foydalanganlik uchun soliq, yer qa’ridan foydalanganlik uchun soliq.", "yer solig’i, mol-mulk solig’i, daromad solig’i, suv resurslardan foydalanganlik uchun soliq.", "yer solig’i, mol-mulk solig’i, maxsus renta solig'i.", "mol-mulk solig’i va daromad solig’i."], "c": 0}, {"q": "Yangi tahrirdagi Soliq kodeksiga asosan, kimlar suv resurslaridan foydalanganlik uchun soliq toʻlovchisi hisoblanadi?", "o": ["O‘zbekiston Respublikasining yuridik shaxslari, faoliyatini O‘zbekiston Respublikasida doimiy muassasalari orqali amalga oshirayotgan O‘zbekiston Respublikasining norezidentlari bo‘lgan yuridik shaxslar", "O‘zbekiston Respublikasi hududida yer qa’ridan foydali qazilmalarni qazib olishni va texnogen mineral hosilalardan foydali qazilmalarni ajratib olishni amalga oshiruvchi yuridik va jismoniy shaxslar", "O‘zbekiston Respublikasining yakka shaxslari", "O‘zbekiston Respublikasi hududida suvdan birlamchi foydalanmaydigan yoki suvni iste’mol qilmaydigan shaxslar"], "c": 0}, {"q": "Suv resurslaridan foydalanganlik uchun soliqning soliq solish ob'yekti ko'rsatilgan to'g'ri javobni belgilang.", "o": ["Yer usti va yer osti manbalaridan olib foydalaniladigan suv resurslari.", "Notijorat tashkilotlar tomonidan notijorat faoliyatni amalga oshirish doirasida foydalaniladigan suv resurslari.", "Sogʻliqni saqlash muassasalari tomonidan davolash maqsadida foydalaniladigan yer osti mineral suvlari.", "Gidroelektrostansiyalar gidravlik turbinalarining harakati uchun foydalaniladigan suv resurslari."], "c": 0}, {"q": "Quyidagilardan qaysilari suv resurslaridan foydalanganlik uchun soliq solish obyekti sifatida qaralmaydi?", "o": ["Gidroelektrostansiyalar gidravlik turbinalarining harakati uchun foydalaniladigan suv resurslari.", "Yer usti manbalaridan olib foydalaniladigan suv resurslari.", "Yer osti manbalaridan olib foydalaniladigan suv resurslari.", "Artezan quduqlari va skvajinalar yordamida olingan suvlar."], "c": 0}, {"q": "Suv resurslaridan foydalanganlik uchun soliqning soliq bazasi ko'rsatilgan to'g'ri javobni belgilang.", "o": ["Foydalanilgan suvning hajmi.", "Soliq davri uchun belgilangan suv miqdori.", "Yillik suv miqdori.", "Hisobot davriga belgilangan belgilangan suv miqdori."], "c": 0}, {"q": "Suv resurslarining soliq bazasi qanday tartibda aniqlanadi?", "o": ["Suv hajmi suvdan foydalanishning buxgalteriya hisobi hujjatlarida aks ettirilgan suv oʻlchagich asboblar koʻrsatkichlari asosida aniqlanadi.", "Ishlatilmagan suv hajmidan kelib chiqqan holda aniqlanadi.", "Suvsoz bilan tuzilgan shartnoma asosida.", "Yomgʻir suvlaridan kelib chiqqan holda aniqlanadi."], "c": 0}, {"q": "Suv resurslaridan foydalanganlik uchun soliq summasi qanday tartibda aniqlanadi?", "o": ["Soliq bazasi va belgilangan soliq stavkalaridan kelib chiqib hisoblanadi.", "Soliq obyektidan kelib chiqib hisoblanadi.", "Sof tushumdan kelib chiqib hisoblanadi.", "Yalpi foydadan kelib chiqib hisoblanadi."], "c": 0}, {"q": "Belgilangan limitlar doirasida yer usti va yer osti manbalaridan olinadigan suv resurslari uchun soliq stavkasi miqdori qaysi hujjatiga asosan belgilanadi?", "o": ["Oʻzbekiston Respublikasi Davlat Budjeti toʻgʻrisidagi Qonuni.", "“S const SECS=[{n:"Yuridik shaxslar",i:"🏢",b:BANK},{n:"Soliq huquqi",i:"⚖️",b:BANK2}];

const partsOf=b=>{const p=[];for(let s=0;s<b.length;s+=SZ)p.push([s,Math.min(s+SZ,b.length)]);return p};

$("#main").scrollTop=0;document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>start(+b.dataset.k))}
function start(k){cur=k;const S=SECS[sec],p=partsOf(S.b)[k];qs=S.b.slice(p[0],p[1]).map(q=>{const o=q.o.map((t,j)=>({t,c:j===q.c}));return{q:q.q,o:shuffle(o.filter(x=>!PIN.test(x.t))).concat(o.filter(x=>PIN.test(x.t)))}});
i=0;score=0;wrong=[];mode="quiz";$("#ttl").textContent=S.n+" · "+(k+1)+"-qism";$("#bar").classList.remove("hide");$("#ft").classList.remove("hide");show()}
function show(){done=false;const q=qs[i];$("#sc").textContent=score;$("#wr").textContent=wrong.length;$("#no").textContent=(i+1)+"/"+qs.length;

$("#main").scrollTop=0;document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
const n=$("#nx");n.textContent="Keyingi";n.disabled=true}
function pick(k){if(done)return;done=true;const q=qs[i];const bs=document.querySelectorAll(".opt");
