<title>Soliqlar bo‘yicha testlar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f4fa;--warn:#d99a00;--card:#fff;--text:#1c2430;--muted:#5c6878;--line:#d9e0ea;--head:#dfe7f4;--pri:#1f4fa3;--ok:#2e9b4f;--okbg:#e7f6ec;--bad:#d64545;--badbg:#fdeceb;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--warn:#f0b429;--card:#18202e;--text:#e8edf5;--muted:#9aa7ba;--line:#2a3547;--head:#162033;--pri:#4f86e8;--ok:#4cc272;--okbg:#14301f;--bad:#ef6b6b;--badbg:#3a1a1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1420;--warn:#f0b429;--card:#18202e;--text:#e8edf5;--muted:#9aa7ba;--line:#2a3547;--head:#162033;--pri:#4f86e8;--ok:#4cc272;--okbg:#14301f;--bad:#ef6b6b;--badbg:#3a1a1c;color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--head)}
header h1{flex:1;font-size:18px;font-weight:600;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.ib{background:none;border:0;font-size:22px;padding:4px 8px;line-height:1}
.bar{display:flex;justify-content:space-between;padding:12px 16px;background:var(--head)}
.chip{background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--muted)}
.chip b{color:var(--pri)}
.star{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;margin-right:8px}
main{flex:1;overflow-y:auto;padding:18px 16px}
.timer{display:block;width:max-content;margin:0 auto 18px;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:14px;color:var(--muted);background:var(--card)}
.q{font-size:18px;font-weight:600;line-height:1.4;margin:0 0 16px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:12px;padding:15px 14px;margin-bottom:12px;font-size:15px;line-height:1.35}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:13px;color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .dot{background:var(--ok);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .dot{background:var(--bad);border-color:var(--bad)}
footer{padding:12px 16px 16px}
.pri{width:100%;background:var(--pri);color:#fff;border:0;border-radius:24px;padding:15px;font-size:16px;font-weight:600}
.pri:disabled{opacity:.45}
.sec{width:100%;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px;font-size:15px;margin-top:10px}
.center{text-align:center;padding-top:30px}
.big{font-size:56px;font-weight:700;color:var(--pri);margin:10px 0}
.muted{color:var(--muted)}
.rv{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px;text-align:left}
.rv i{display:block;color:var(--ok);font-style:normal;margin-top:6px}
.hide{display:none}
.ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--head);display:grid;place-items:center;font-size:24px}
.chip .bad{color:var(--bad)}.best.y{color:var(--warn)}.best.r{color:var(--bad)}#back{flex:none;width:42px;height:42px;padding:0;border-radius:50%;background:var(--pri);border:0;color:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.28);transition:transform .12s,box-shadow .12s}#back svg{width:22px;height:22px;display:block}#back:active{transform:scale(.9);box-shadow:0 1px 4px rgba(0,0,0,.3)}.best{margin-left:auto;flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--ok);background:conic-gradient(currentColor calc(var(--p)*1%),var(--line) 0)}.best b{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:14px;font-weight:700;letter-spacing:-.3px}.sub{display:block;color:var(--muted);font-size:13px;margin-top:3px}.num{border-color:var(--pri);color:var(--pri);font-weight:600}
</style></head><body>

<main id="main"></main>
<footer id="ft"><button class="pri" id="nx"></button></footer>
</div>
<script>
const BANK3=[{"q": "Boshqaruv ilmi qachon paydo bo’lgan?", "o": ["odamlar bilan birga paydo bo’lgan", "mehnatni kooperatsiyalash davrida", "sanoatni rivojlantirish davrida", "ishlab chiqarishni ixtisoslashtirish davrida"], "c": 0}, {"q": "Menejment bu …", "o": ["Boshqaruv hokimyati va san’ati, resuslarni boshqarish bo’yicha alohida mohirlik va ma’muriy ko’nikmadir", "Resuslarni boshqarish va munosabatlarni to‘g’ri o‘rnatish bo’yicha alohida mohirlik va ma’muriy ko’nikmadir", "Boshqaruv hokimyati va rahbarlarning boshqaruv san’atidir", "Boshqaruv, rahbarlik va mohirlik san’atidir"], "c": 0}, {"q": "Menejment fani bu – boshqaruvchiga …", "o": ["Tanlovni to’gri amalga oshirishni va oqil qaror qabul qilishni o’rgatuvchi fandir", "Ishchan va maqbul qaror qabul qilishni o’rgatuvchi fandir", "Tanlovni to’gri amalga oshirishni va munosabatlarni to‘g’ri o‘rnatish o’rgatuvchi fandir", "Oqil qaror qabul qilishni va munosabatni o’rgatuvchi fandir"], "c": 0}, {"q": "Menejerga qo’yiladigan asosiy talablar", "o": ["hodimlar bilan o’zaro aloqani tiklash, ularda ishonchni, ma`naviyatni mustahkamlash", "hodimlar haqida ma`lumotlarni to’plash va tahlil etish", "psixologik tashxisni belgilash va maxfiy ma`lumotlarni saqlay bilish", "boshqarish texnologiyasini yangilab borish"], "c": 0}, {"q": "Menejment obekti bo’lib ...", "o": ["mamlakat, qonun chiqaruvchi hokimiyat, tuman yoki shahar hisoblanadi", "qonun chiqaruvchi hokimiyat, direktor, menejer, tuman yoki shahar hisoblanadi", "mamlakat, tuman yoki shahar hisoblanadi", "tuman yoki shahar hisoblanadi"], "c": 0}, {"q": "Menejment subekti bo’lib ...", "o": ["Boshqaruv organlari va ijro etuvchi hokimyat hisoblanadi", "Shahar va konsernlar hisoblanadi", "Tarmoqlar va korxonalar hisoblanadi", "Mamlakat va bo‘lim boshliqlari hisoblanadi"], "c": 0}, {"q": "Menejment predmeti fan sifatida…", "o": ["Boshqaruv munosabatlari va uslublari, jihatlari va qonuniyatlarini o’rgatadi", "Odamlani boshqarishga o’rgatadi", "Maqsadga yo’naltirilgan nazariya jihatlarni shakillantiradi", "Boshqaruv qonuniyatlarini o’rgatadi"], "c": 0}, {"q": "Boshqaruvchi obektlar bilan o’zaro bog’lanishda va aloqadorlik o’rnatmoqchi bo’lsa, u holda menejment fani …", "o": ["Kompleksli yondashuv usulini qo’llaydi", "Tizimli yondashuv usulini qo’llaydi", "Tarkibiy yondashuv usulini qo’llaydi", "Modellashtirish usulini qo'llaydi"], "c": 0}, {"q": "Boshqariluvchi ob'ektning konkret sharoitdagi ichki va tashqi vaziyatiga qarab boshqarishning ma'qul uslubi", "o": ["Vaziyatli", "Iqtisodiy", "Integratsion", "Kompleks"], "c": 0}, {"q": "1885-1920-yillarda ilmiy menejment namoyondalari…", "o": ["Teylor, G. Emerson va boshq.", "Fayol, G. Saymon va boshq.", "Deyl, M. Veber va boshq.", "Fayol va boshq."], "c": 0}, {"q": "Mumtoz yoki ma'muriy menejment namoyondalarini aniqlang?", "o": ["Fayol, M. Veber va boshq.", "Teylor, G. Emerson va boshq.", "Amir Temur va boshq.", "Teylor va boshq."], "c": 0}, {"q": "\"Inson munosabatlari\" maktabi namoyandalarini aniqlang?", "o": ["Meyo, R. Laykert va boshq.", "Fayol, M. Veber va boshq.", "Teylor, G.Emerson va boshq.", "Emerson va boshq."], "c": 0}, {"q": "Miqdoriy tizimli yoki zamonaviy menejment namoyondalarini aniqlang?", "o": ["G. Saymon, P. Druker, E. Deyl va boshq.", "Meyo, R. Laykert va boshq.", "Teylor, G. Emerson va boshq.", "Laykert va boshq."], "c": 0}, {"q": "Teylorning diqqat markazida, eng avvalo ...", "o": ["Yollanma ishchilar mehnatining unumdorligini oshirishda g'oyatda samarador va maqbul usullarni izlash", "14 tadan iborat boshqarish tamoyillari turadi", "Ikki tamoyil, ya’ni aniq qo’yilgan maqsad va g’oyalar, shuningdek oqil va sog’lom fikr turadi", "Aniq qo’yilgan maqsad va g’oyalar turadi"], "c": 0}, {"q": "Emersonning diqqat markazida, eng avvalo ...", "o": ["Ikki tamoyil, ya’ni aniq qo’yilgan maqsad va g’oyalar, shuningdek oqil va sog’lom fikr turadi", "14 tadan iborat boshqarish tamoyillari, ya’ni mehnat taqsimoti, vakolat va mas’uliyat turadi", "Insoniy munosabatlarni shakillantirish fikri yotadi", "12 tadan iborat boshqarish tamoyillari turadi"], "c": 0}, {"q": "Fayolning diqqat markazida, eng avvalo:", "o": ["14 tadan iborat boshqarish tamoyillari, ya’ni mehnat taqsimoti, vakolat va mas’uliyat turadi", "“insoniy munosabatlar”ni shakllantirish fikri turadi", "ikki prinsip, ya`ni aniq qo’yilgan maqsad va g’oyalar, shuningdek odil va sog’lom fikr yotadi", "yollanma ishchilar mehnatining unumdorligini oshirishda g’oyatda samarador va maqbul usullarni izlash turadi"], "c": 0}, {"q": "Insoniy munosabatlar maktabi …", "o": ["Teylorizmga qarshi turuvchi maktab bo’lib, ishchi – bu fikrsiz robot emas, degan g’oyani ilgari surgan maktabdir", "“insoniy munosabatlar”ni shakllantirish fikri turadi", "ikki prinsip, ya`ni aniq qo’yilgan maqsad va g’oyalar, shuningdek odil va sog’lom fikr yotadi", "yollanma ishchilar mehnatining unumdorligini oshirishda g’oyatda samarador va maqbul usullarni izlash turadi"], "c": 0}, {"q": "X va Y nazariyasining namoyondasi kim ?", "o": ["Mak –Gregor", "G.Ford", "F.Teylor", "G.Emerson"], "c": 0}, {"q": "\"X\" nazariyasiga ko’ra yollanma xodim bu ...", "o": ["Tabiatan yalqov kishi", "Faol kishi", "Uddabiron kishi", "Tabiatan faol, uddabiron va tashabbuskor"], "c": 0}, {"q": "\"Y\" nazariyasiga ko’ra yo’llanma xodim …", "o": ["Tabiatan faol, uddabiron va tashabbuskor", "Tabiatan yalqov kishi", "Izzat talab kishi", "Ziqna kishi"], "c": 0}, {"q": "\"X\" nazariyasi sharoitida menejer ...", "o": ["Xodimlarni doimo jazolab, jarima solish bilan qo’rqitib turishi, majburlashi, nazorat qilishi zarur", "Xodimlarni rag’batlantirish kerak", "Ularga qulay muhit yaratib berish kerak", "Doimo mukofot berib turish kerak"], "c": 0}, {"q": "\"Y\" nazariyasi sharoitida menejer bu-...", "o": ["Xodimlarni rag’batlantirish va ularga qulay muhit yaratib berish", "Xodimlarni doimo jazolab, jarima solish bilan qo’rqitib turish", "Xodimlarga e’tiborsiz bo’lish", "Xodimlarni doimo majburlash, nazorat qilib turish zarur"], "c": 0}, {"q": "Zamonaviy menejmentning boshqarishga yondashuv turlari?", "o": ["Tizimli yondoshuv, vaziyatli yondoshuv, funktsional yondoshuv, miqdorli yondoshuv", "Funktsional yondoshuv, miqdorli yondoshuv", "Tizimli yondoshuv, vaziyatli yondoshuv", "Tizimli yondoshuv, miqdorlili yondoshuv"], "c": 0}, {"q": "Tuzuklarda keltirilgandek #Temur davlatni … nafar vazir bilan boshqargan?", "o": ["7 nafar", "12 nafar", "9 nafar", "3 nafar"], "c": 0}, {"q": "Amir Temurning e`tiqod qo’ygan piri, tinchliksevar va raiyatparvar inson Zaynuddin Abubakr Toybodiy Temur ga maktub yozib, uning saltanat yumushlarida quyidagi ishlarnnng qaysi birini qo’llashini tavsiya etgan:", "o": ["kengash, mashvaratu maslahat, xushyorligu-muloxazakorlik", "kengash, mashvaratu maslahat", "xushyorligu-muloxazakorlik, tartib va intizom", "kengash, xushyorligu-muloxazakorlik"], "c": 0}, {"q": "\"Maqsadlar shajarasi\"– bu nima?", "o": ["Maqsadlar bilan ularga erishish vositalari o’rtasidagi aloqaning grafik tasviri", "Maqsadlarning turlari, kelgusidagi davomi", "Maqsadlarni davom ettirishni shakillantirish", "Maqsadlarning bo'linishi"], "c": 0}, {"q": "Boshqaruvning amalga oshirilishiga qarab va amalga oshirish muddatiga qarab, bular maqsadning qanday belgilari?", "o": ["Turkumlash belgilari", "Ajratish belgilari", "Birlashtirish belgilari", "Qismlarga bo'lish belgilari"], "c": 0}, {"q": "Joriy maqsadlar deganda ...", "o": ["Bir yil ichida, yil choragi, bir oy va undan ham kamroq muddat mobaynida amalga oshiriladigan maqsadlar tushuniladi", "Besh yil yoki undan ko’proq davr mobaynida amalga oshiriladigan maqsadlar tushuniladi", "Har kuni qabul qilinadigan va amalga oshiriladigan odatiy maqsadlar tushuniladi", "Har yil mobaynida amalga oshiriladigan maqsadlar tushuniladi"], "c": 0}, {"q": "Uzluksiz maqsadlar deganda ...", "o": ["Har kuni qabul qilinadigan va amalga oshiriladigan odatiy maqsadlar tushuniladi", "Bir yil ichida, yil choragi, bir oy va undan ham kamroq muddat mobaynida amalga oshiriladigan maqsadlar tushuniladi", "Besh y imlar yuqori intellektual salohiyatga ega bo'lib, ular tashkilot maqsadlariga erishishda tashabbuskorlik va jonbozlik ko'rsatadi", "\"X\" nazariyasi — xodimlar majburlashni talab qiladi", "Ma'muriy usul — buyruq va intizomga tayanadi", "Avtoritar uslub — rahbar yakka qaror qiladi"], "c": 0}, {"q": "Vaziyat: Kompaniyada kutilmagan moliyaviy muammo yuzaga keldi va zudlik bilan xarajatlarni qisqartirish bo‘yicha qaror qabul qilish kerak. Bo‘lim boshlig‘i xodimlarning fikrini so‘rab o‘tirmasdan, shaxsan o‘zi ish vaqtini uzaytirish va mukofot pullarini vaqtincha to‘xtatish haqida buyruq berdi. Savol: Ushbu menejer qaysi boshqaruv uslubidan foydalandi?", "o": ["Avtoritar uslub — barcha qarorlar rahbar tomonidan yakka tartibda, xodimlar fikrini hisobga olmasdan, buyruq va direktiv shaklda qabul qilinadi", "Liberal uslub — rahbar jarayonga aralashmaydi", "Ijtimoiy-psixologik usul — jamoaviy muhitga tayanadi", "Demokratik uslub — qaror jamoa bilan birga qabul qilinadi"], "c": 0}, {"q": "Vaziyat: Marketing bo‘limiga yangi mahsulotni bozorga olib chiqish vazifasi yuklatildi. Menejer bo‘lim xodimlarini yig‘ib, muammoni o‘rtaga tashladi: \"Bizga yangi g‘oyalar kerak, har biringiz o‘z taklifingizni bering, eng yaxshisini birgalikda tanlaymiz\". Yakuniy qaror jamoaning umumiy ovozi va kelishuvi asosida qabul qilindi. Savol: Ushbu menejerga xos bo‘lgan boshqaruv uslubini aniqlang?", "o": ["Demokratik uslub — rahbar xodimlar bilan vakolatlarni taqsimlaydi, tashabbusni qo'llab-quvvatlaydi va jamoaviy qaror qabul qilishni afzal ko'radi", "Liberal uslub — rahbar jarayonga minimal aralashadi", "\"X\" nazariyasi — xodimlar majburlanadi", "Avtoritar uslub — barcha qarorlar yakka tartibda qabul qilinadi"], "c": 0}, {"q": "Vaziyat: Ilmiy-tadqiqot markazi rahbari o‘z xodimlariga shunday deydi: \"Sizlar yuqori malakali mutaxassissizlar, men sizlarga faqat yakuniy maqsadni va muddatni belgilayman. Ishni qanday tashkil qilish, qaysi usuldan foydalanishni o‘zingiz hal qilasiz. Men faqat natijani qabul qilaman\". Savol: Ushbu vaziyatda menejer qaysi uslubni qo‘llamoqda?", "o": ["Liberal uslub — rahbar ish jarayoniga minimal darajada aralashadi va xodimlarga vazifalarni bajarishda maksimal darajada erkinlik beradi", "Avtoritar uslub — rahbar har bir qadamni nazorat qiladi", "Demokratik uslub — rahbar har bir masalani jamoa bilan muhokama qiladi", "Ma'muriy usul — qat'iy buyruq va intizom"], "c": 0}, {"q": "Vaziyat: \"Smart-Tek\" kompaniyasi rahbari ish unumdorligini oshirish maqsadida yangi tizim joriy qildi. Unga ko‘ra, har bir xodim belgilangan rejani oshirib bajargan taqdirda, ish haqining 20 foizi miqdorida qo‘shimcha bonus oladi. Shuningdek, yil yakunida eng yaxshi ko‘rsatkichga ega bo‘lgan xodimlarga bepul sanatoriy yo‘llanmasi beriladigan bo‘ldi. Savol: Rahbar xodimlarni boshqarishda qaysi usuldan foydalanmoqda?", "o": ["Iqtisodiy usullar — xodimlarning moddiy manfaatdorligi va moliyaviy rag'batlantirish choralari orqali ish unumdorligiga ta'sir o'tkazish jarayoni", "Liberal uslub — to'liq erkinlik", "Ma'muriy usullar — buyruq va intizom", "Ijtimoiy-psixologik usullar — ma'naviy rag'bat"], "c": 0}, {"q": "Vaziyat: Qurilish firmasi direktori ish joyida tartib-intizomni kuchaytirishga qaror qildi. U yangi ichki tartib qoidalarini tasdiqladi: ishga 5 daqiqa kechikkan xodimdan tushuntirish xati olinadi, xavfsizlik qoidalarini buzganlar esa darhol hayfsan oladi. Barcha topshiriqlar faqat yozma buyruq shaklida beriladi. Savol: Ushbu direktor boshqaruvning qaysi uslubiga ko‘proq tayanmoqda?", "o": ["Ma'muriy (tashkiliy-farmoyish berish) usullar — qat'iy mehnat intizomi, rasmiy buyruqlar va xizmat yo'riqnomalari orqali boshqarish tizimi", "Ijtimoiy-psixologik usullar — ma'naviy rag'bat", "Demokratik uslub — jamoaviy qaror", "Iqtisodiy usullar — moddiy rag'batlantirish"], "c": 0}, {"q": "Vaziyat: Yosh menejer jamoada o‘zaro ishonch va samimiy muhit yaratishni xohlaydi. U har oyda xodimlarning tug‘ilgan kunini birgalikda nishonlashni yo‘lga qo‘ydi, har hafta \"eng namunali xodim\" nominatsiyasida hamkasblarining olqishiga sazovor bo‘lganlarni faxriy yorliq bilan taqdirlamoqda. U xodimlarning oilaviy sharoitidan xabar olib turadi. Savol: Menejer qo‘llayotgan usul boshqaruvning qaysi turiga kiradi?", "o": ["Ijtimoiy-psixologik usullar — ma'naviy rag'bat, ijobiy jamoaviy muhit va shaxsiy e'tibor orqali xodimlarni ichki motivatsiya qilishga qaratilgan usul", "Iqtisodiy usullar — moliyaviy rag'batlantirish", "Ma'muriy usullar — qat'iy intizom", "Avtoritar uslub — yakka qaror"], "c": 0}, {"q": "Vaziyat: Korxonada mahsulot sifati tushib ketdi. Direktor hamma bo‘lim boshliqlarini yig‘ib: \"Agar shu oyda sifat ko‘rsatkichi yaxshilanmasa, barcha bo‘lim boshliqlari intizomiy jazoga tortiladi va lavozimi pasaytiriladi. Bu mening yakuniy qarorim va u muhokama qilinmaydi\", deb qisqa ko‘rsatma berdi. Savol: Ushbu vaziyatda direktor qaysi boshqaruv usulidan foydalandi?", "o": ["Ma'muriy usul — xodimlarni majburlash, javobgarlikka tortish va qat'iy intizomiy choralarni qo'llash orqali natijaga erishishni nazarda tutadi", "Iqtisodiy usul — moddiy rag'batlantirish", "Ijtimoiy-psixologik usul — ma'naviy rag'bat", "Liberal uslub — erkinlik berish"], "c": 0}, {"q": "Vaziyat: \"Yulduz\" qandolat fabrikasi rahbari kelasi yil uchun mahsulot sotish hajmini 15 foizga oshirishni maqsad qildi. Buning uchun u qaysi oylarda qancha mahsulot ishlab chiqarish kerakligi, qanday xomashyo sotib olinishi va qaysi bozorlarga kirib borish kerakligini batafsil belgilab chiqdi. Savol: Rahbar boshqaruvning qaysi funksiyasini amalga oshirmoqda?", "o": ["Rejalashtirish — tashkilotning uzoq va qisqa muddatli maqsadlarini belgilash hamda ularga erishishning aniq strategiya va yo'llarini ishlab chiqish", "Tashkil etish — vazifa va vakolatlarni taqsimlash", "Nazorat — natijalarni standart bilan solishtirish", "Motivatsiya — xodimlarni rag'batlantirish"], "c": 0}, {"q": "Vaziyat: Yangi ochilgan o‘quv markazida direktor ishni boshlashdan avval shtatlar jadvalini tuzdi. U kim dars berishi, kim mijozlar bilan muloqot qilishi va kim texnik xavfsizlikka javob berishi kerakligini aniqladi. Har bir xodimga o‘z majburiyatlarini tushuntirib, ularga kerakli sharoitlarni yaratib berdi. Savol: Direktor bu vaziyatda boshqaruvning qaysi funksiyasiga e’tibor qaratdi?", "o": ["Tashkil etish — tashkilotning barqaror tuzilmasini shakllantirish, vazifa va vakolatlarni hamda resurslarni xodimlar o'rtasida taqsimlash jarayoni", "Rejalashtirish — maqsadlarni belgilash", "Nazorat — natijalarni tekshirish", "Motivatsiya — xodimlarni rag'batlantirish"], "c": 0}, {"q": "Vaziyat: Logistika kompaniyasida haydovchilarning ish samaradorligi tushib ketdi. Menejer vaziyatni tahlil qilib, yangi tizim joriy qildi: endi yuklarni o‘z vaqtida va talofatsiz yetkazib bergan xodimlarga qo‘shimcha mukofot puli beriladi hamda “Oyning eng yaxshi haydovchisi” nominatsiyasi g‘olibi faxriy yorliq bilan taqdirlanadi. Savol: Menejerning bu harakatlari boshqaruvning qaysi funksiyasini ifodalaydi?", "o": ["Motivatsiya — xodimlarning moddiy va ma'naviy ehtiyojlariga ta'sir qilish orqali ularni tashkilot maqsadlariga erishish yo'lida faollashtirish jarayoni", "Nazorat — natijalarni tekshirish", "Tashkil etish — tuzilmani shakllantirish", "Rejalashtirish — maqsadlarni belgilash"], "c": 0}, {"q": "Vaziyat: Tikuvchilik tsexida bir kunda 100 ta ko‘ylak tikish rejalashtirilgan edi. Ish kuni yakunida tsex boshlig‘i tayyor mahsulotlarni sanab ko‘rdi va ularning soni 85 ta ekanligini aniqladi. U kamchilik sabablarini o‘rganib, ertangi ish kunida bu xatoni takrorlamaslik choralarini ko‘rdi. Savol: Tsex boshlig‘i boshqaruvning qaysi funksiyasini bajardi?", "o": ["Nazorat — amaldagi natijalarni avvaldan rejalashtirilgan standartlar bilan solishtirish, og'ishlarni aniqlash va ularni tuzatish bo'yicha chora ko'rish", "Tashkil etish — vazifalarni taqsimlash", "Motivatsiya — xodimlarni rag'batlantirish", "Rejalashtirish — maqsadlarni belgilash"], "c": 0}, {"q": "Vaziyat: Kompaniyaning eng tajribali xodimlaridan biri so‘nggi paytlarda ish sifatini pasaytirib yubordi va jamoa bilan kam muloqot qiladigan bo‘lib qoldi. Zamonaviy menejer uni jazolash yoki hayfsan berish o‘rniga, xodimni suhbatga chorladi. Suhbat davomida xodimning oilasida qiyinchilik bo‘layotgani aniqlandi. Menejer unga bir necha kunlik dam olish berdi va ish grafigini vaqtincha moslashtirib berdi. Savol: Zamonaviy menejer bu vaziyatda o‘zining qaysi muhim ko‘nikmasini namoyon qildi?", "o": ["Emotsional intellekt — o'zining va boshqalarning his-tuyg'ularini tushunish, ularni boshqarish va xodimlarga insoniy yondashuv orqali motivatsiya berish qobiliyati", "Raqamli savodxonlik — texnologiyalarni joriy etish", "Moslashuvchanlik — tez javob berish", "Delegirlash — vakolatlarni topshirish"], "c": 0}, {"q": "Vaziyat: Logistika kompaniyasi rahbari barcha hisobotlarni qog‘ozda yuritish an’anasidan voz kechishga qaror qildi. U jamoaga yeni bulutli dasturiy ta’minotni joriy etdi. Ba’zi xodimlar bunga qarshilik ko‘rsatishiga qaramay, menejer treninglar tashkil etdi va bu tizim vaqtni 30 foizga tejashini isbotlab berdi. Savol: Bu keysda zamonaviy menejerning qaysi xislati yaqqol ko‘rinadi?", "o": ["Raqamli savodxonlik va o'zgarishlarni boshqarish — zamonaviy texnologiyalarni amaliyotga joriy etish va xodimlarni innovatsiyalarga samarali moslashtirish qobiliyati", "Avtoritar uslub — yakka qaror", "Delegirlash — vakolatlarni topshirish", "Emotsional intellekt — his-tuyg'ularni tushunish"], "c": 0}, {"q": "Vaziyat: Reklama agentligi menejeri barcha mayda topshiriqlarni (mijozga qo‘ng‘iroq qilish, hujjatlarni rasmiylashtirish) o‘zi bajarishni to‘xtatdi. U bu vazifalarni yordamchilariga taqsimlab berdi, o‘zi esa faqat yangi strategik hamkorlarni jalb qilish bilan shug‘ullana boshladi. Natijada kompaniya foydasi ikki barobar ortdi. Savol: Zamonaviy menejer nima hisobiga ish unumdorligini oshirdi?", "o": ["Vakolatlarni samarali topshirish (delegirlash) — kundalik operatsion ishlarni xodimlarga topshirish orqali lab chiqarish yo'nalishini o'zgartirish talab etilmoqda. Savol: Ushbu vaziyatda tashqi muhitning qaysi omili korxonani qiyin ahvolga solib qo'ydi?", "o": ["Huquqiy va siyosiy omillar — qonunchilikdagi o'zgarishlar, davlat organlarining qarorlari va me'yoriy hujjatlarning korxona faoliyatiga ta'siri", "Texnologik omillar — yangi uskunalar", "Iqtisodiy omillar — inflyatsiya va valyuta kursi", "Ijtimoiy-madaniy omillar — aholining didi"], "c": 0}, {"q": "Vaziyat: \"Dizayn-Pro\" me'morchilik byurosi katta loyihani qo'lga kiritdi. Rahbar loyihani bajarish uchun barcha kerakli kompyuter va dasturlarga ega, ofis ham juda qulay. Biroq, loyihani yakunlash uchun yetarli malakaga ega bo'lgan muhandislar yetishmayapti. Mavjud xodimlar esa yangi murakkab loyihani tushuna olishmayapti. Savol: Bu vaziyatda tashkilotning ichki muhitidagi qaysi asosiy element yetishmayapti?", "o": ["Inson resurslari — xodimlarning muayyan vazifalarni bajarish uchun zarur bo'lgan bilim, professional ko'nikma va malakasining yetarli emasligi", "Tashqi muhit — bozor talabi", "Moddiy resurslar — kompyuter va dasturlar", "Moliyaviy resurslar — mablag' yetishmasligi"], "c": 0}, {"q": "Vaziyat: Korxonada yangi ish tartibi joriy qilindi. Rahbar barcha xodimlarga yozma va og‘zaki tarzda tushuntirish berdi, savollarga javob berdi va qo‘shimcha ko‘rsatmalar yubordi. Natijada ish jarayoni tez moslashdi. Savol: Bu vaziyatda samarali kommunikatsiyaning asosiy omili nimada?", "o": ["Axborotni aniq, tushunarli va to'liq yetkazish — xodimlarga topshiriq mohiyatini turli kanallar orqali yetkazish va ularda tushunmovchilik qoldirmaslik", "Faqat norasmiy kanallardan foydalanish", "Teskari aloqasiz bir tomonlama buyruq", "Axborotni yashirish — faqat rahbarlarga yetkazish"], "c": 0}, {"q": "Vaziyat: Rahbar topshiriq bergach, xodimlardan fikr va takliflar so‘radi. Muhokama natijasida ayrim kamchiliklar oldindan aniqlandi va tuzatildi. Savol: Ushbu holatda qaysi boshqaruv elementi samaradorlikni oshirdi?", "o": ["Teskari a const SECS=[{n:"Menejment",i:"📊",b:BANK3}];

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const partsOf=b=>{const p=[];for(let s=0;s<b.length;s+=SZ)p.push([s,Math.min(s+SZ,b.length)]);return p};
const best={};
try{Object.assign(best,JSON.parse(localStorage.getItem("best")||"{}"))}catch(e){}
try{if(!localStorage.getItem("mig13")){const o=Object.assign({},best);Object.keys(best).forEach(k=>delete best[k]);Object.keys(o).forEach(k=>{if(k.indexOf("2-")===0)best["0-"+k.slice(2)]=o[k]});localStorage.setItem("best",JSON.stringify(best));localStorage.setItem("mig13","1")}}catch(e){}
function saveBest(){try{localStorage.setItem("best",JSON.stringify(best))}catch(e){}}
let qs,i,score,wrong,mode="home",cur,sec=0,to,done;
function eff(){const t=document.documentElement.getAttribute("data-theme");return t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}
function setTheme(t){document.documentElement.setAttribute("data-theme",t);$("#th").textContent=t==="dark"?"☀":"☾";try{localStorage.setItem("theme",t)}catch(e){}}
try{const t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
$("#th").textContent=eff()==="dark"?"☀":"☾";
$("#th").onclick=()=>setTheme(eff()==="dark"?"light":"dark");
let canHist=true;const push=l=>{try{history.pushState({l},"")}catch(e){canHist=false}};
const goBack=()=>{if(canHist)history.back();else if(mode==="parts")home();else parts()};
$("#back").onclick=()=>{if(mode==="home")return;goBack()};
function home(){clearTimeout(to);mode="home";$("#bar").classList.add("hide");$("#ft").classList.add("hide");$("#ttl").textContent="Soliqlar bo‘yicha testlar";
$("#main").innerHTML='<h2 style="margin:4px 0 16px">Bo‘limlar <small class="muted" style="font-size:11px;font-weight:400">v14</small></h2>'+SECS.map((s,k)=>'<button class="opt" data-k="'+k+'"><span class="ico">'+s.i+'</span><span>'+esc(s.n)+'<span class="sub">'+s.b.length+' ta test · '+partsOf(s.b).length+' ta qism</span></span></button>').join("");
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{sec=+b.dataset.k;parts();push(1)})}
function parts(){clearTimeout(to);mode="parts";const S=SECS[sec],P=partsOf(S.b);$("#bar").classList.add("hide");$("#ft").classList.add("hide");$("#ttl").textContent=S.n;
$("#main").innerHTML='<h2 style="margin:4px 0">'+esc(S.n)+'</h2><p class="muted" style="margin:0 0 16px">'+S.b.length+' ta test · '+P.length+' ta qism</p>'+
P.map((p,k)=>'<button class="opt" data-k="'+k+'"><span class="dot num">'+(k+1)+'</span><span>'+(k+1)+'-qism<span class="sub">'+(p[0]+1)+'–'+p[1]+'-savollar · '+(p[1]-p[0])+' ta test</span></span>'+(best[sec+"-"+k]?'<span class="best '+(best[sec+"-"+k].p>=90?'g':best[sec+"-"+k].p>=70?'y':'r')+'" style="--p:'+best[sec+"-"+k].p+'"><b>'+best[sec+"-"+k].p+'%</b></span>':'')+'</button>').join("");
$("#main").scrollTop=0;document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>start(+b.dataset.k))}
function start(k){if(mode==="parts")push(2);cur=k;const S=SECS[sec],p=partsOf(S.b)[k];qs=shuffle(S.b.slice(p[0],p[1])).map(q=>{const o=q.o.map((t,j)=>({t,c:j===q.c}));return{q:q.q,o:shuffle(o.filter(x=>!PIN.test(x.t))).concat(o.filter(x=>PIN.test(x.t)))}});
i=0;score=0;wrong=[];mode="quiz";$("#ttl").textContent=S.n+" · "+(k+1)+"-qism";$("#bar").classList.remove("hide");$("#ft").classList.remove("hide");show()}
function show(){done=false;const q=qs[i];$("#sc").textContent=score;$("#wr").textContent=wrong.length;$("#no").textContent=(i+1)+"/"+qs.length;
$("#main").innerHTML='<p class="q">'+esc(q.q)+'</p>'+q.o.map((o,k)=>'<button class="opt" data-k="'+k+'"><span class="dot"></span><span>'+esc(o.t)+'</span></button>').join("");
$("#main").scrollTop=0;document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
const n=$("#nx");n.textContent="Keyingi";n.disabled=true}
function pick(k){if(done)return;done=true;const q=qs[i];const bs=document.querySelectorAll(".opt");
bs.forEach((b,j)=>{if(q.o[j].c){b.classList.add("ok");b.querySelector(".dot").textContent="✓"}});
if(q.o[k].c){score+=10;$("#sc").textContent=score;to=setTimeout(next,600)}
else{bs[k].classList.add("bad");bs[k].querySelector(".dot").textContent="✕";wrong.push(q);$("#wr").textContent=wrong.length;const n=$("#nx");n.disabled=false;n.textContent=i===qs.length-1?"Yakunlash":"Keyingi"}}
function next(){if(i===qs.length-1)finish();else{i++;show()}}
function finish(){mode="end";const n=qs.length,r=n-wrong.length,p=Math.round(r/n*100);{const o=best[sec+"-"+cur];if(!o||p>o.p){best[sec+"-"+cur]={p,r,n};saveBest()}}$("#bar").classList.add("hide");
$("#main").innerHTML='<div class="center"><div class="muted">'+(cur+1)+'-qism natijasi</div><div class="big">'+r+' / '+n+'</div><p>'+p+'% to‘g‘ri · '+score+' ball</p></div>'+
(wrong.length?'<h3>Xato javoblar</h3>'+wrong.map(q=>'<div class="rv">'+esc(q.q)+'<i>✓ '+esc(q.o.find(o=>o.c).t)+'</i></div>').join(""):'<p class="center">Barcha javoblar to‘g‘ri! 🎉</p>')+'<button class="sec" id="ls">Qismlar ro‘yxati</button>';
$("#ls").onclick=goBack;$("#nx").textContent="Qayta boshlash";$("#nx").disabled=false}
$("#nx").onclick=()=>{if(mode==="end")start(cur);else next()};
try{history.replaceState({l:0},"")}catch(e){canHist=false}
addEventListener("popstate",e=>{const l=e.state&&e.state.l||0;if(l===0)home();else parts()});
home();
</script><script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body></html>
